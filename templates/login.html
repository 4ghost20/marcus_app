{% extends "base.html" %}
{% block title %}Login – Marcus Aurelius{% endblock %}

{% block content %}
<section class="container mt-4" style="max-width: 400px;">
    <h2 class="mb-3">Login</h2>
    <form method="POST">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input name="username" id="username" type="text" class="form-control" placeholder="Enter username" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input name="password" id="password" type="password" class="form-control" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    <div class="mt-3 text-center">
        <small>Don't have an account? <a href="{{ url_for('register') }}">Register here</a></small>
    </div>
</section>
{% endblock %}
