{% extends "base.html" %}
{% block content %}
<h2>Edit Reflection</h2>

<form method="POST">
    {{ form.hidden_tag() }}

    <div>
        {{ form.title.label }}<br>
        {{ form.title(size=40) }}
    </div>

    <div>
        {{ form.content.label }}<br>
        {{ form.content(cols=50, rows=10) }}
    </div>

    {{ form.submit(value="Update Entry") }}
</form>
{% endblock %}
