<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}Marcus Aurelius App{% endblock %}</title>

  <!-- Optional: Google Font for calm, readable text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <a href="{{ url_for('home') }}">Marcus Aurelius</a>
      </div>
     <nav class="main-nav">
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('about') }}">About</a>
    <a href="{{ url_for('daily') }}">Daily</a>
    <a href="{{ url_for('entry') }}">Reflection</a>
    <a href="{{ url_for('lessons') }}">Lessons</a> <!-- new -->

</nav>

    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>Live with purpose • Teach by example • Keep calm</small>
    </div>
  </footer>
</body>
</html>
