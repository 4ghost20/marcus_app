{% extends "base.html" %}
{% block title %}Register – Marcus Aurelius{% endblock %}

{% block content %}
<section class="container mt-4" style="max-width: 400px;">
    <h2 class="mb-3">Create Account</h2>
    <form method="POST">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input name="username" id="username" type="text" class="form-control" placeholder="Enter username" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input name="email" id="email" type="email" class="form-control" placeholder="Enter email" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input name="password" id="password" type="password" class="form-control" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-success w-100">Register</button>
    </form>

    <div class="mt-3 text-center">
        <small>Already have an account? <a href="{{ url_for('login') }}">Login here</a></small>
    </div>
</section>
{% endblock %}
